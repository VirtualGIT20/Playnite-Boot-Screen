name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      PLAYNITE_VERSION: '10.56'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v4
        with:
          nuget-version: latest

      - name: Resolve version from tag
        id: version
        shell: powershell
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid release tag: ${{ github.ref_name }}"
          }

          "version=$version" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Append `
              -Encoding utf8

      - name: Ensure .NET Framework 4.6.2 targeting pack
        shell: powershell
        run: |
          $frameworkList = Join-Path `
            ${env:ProgramFiles(x86)} `
            'Reference Assemblies\Microsoft\Framework\.NETFramework\v4.6.2\RedistList\FrameworkList.xml'

          if (-not (Test-Path -LiteralPath $frameworkList)) {
            choco install netfx-4.6.2-devpack -y --no-progress

            if ($LASTEXITCODE -ne 0) {
              throw "Installation of .NET Framework 4.6.2 Developer Pack failed with exit code $LASTEXITCODE."
            }
          }

          if (-not (Test-Path -LiteralPath $frameworkList)) {
            throw '.NET Framework 4.6.2 Targeting Pack is still unavailable.'
          }

      - name: Verify release metadata
        shell: powershell
        run: |
          .\scripts\verify-release.ps1 `
            -Version '${{ steps.version.outputs.version }}'

      - name: Download Playnite Toolbox runtime
        shell: powershell
        run: |
          $archivePath = Join-Path `
            $env:RUNNER_TEMP `
            "Playnite-$env:PLAYNITE_VERSION.7z"

          $extractPath = Join-Path `
            $env:RUNNER_TEMP `
            "Playnite-$env:PLAYNITE_VERSION"

          $downloadUrl = `
            "https://github.com/JosefNemec/Playnite/releases/download/$env:PLAYNITE_VERSION/$env:PLAYNITE_VERSION.7z"

          $sevenZip = @(
            (Join-Path $env:ProgramFiles '7-Zip\7z.exe')
            (Join-Path ${env:ProgramFiles(x86)} '7-Zip\7z.exe')
          ) |
            Where-Object {
              $_ -and (Test-Path -LiteralPath $_ -PathType Leaf)
            } |
            Select-Object -First 1

          if (-not $sevenZip) {
            choco install 7zip -y --no-progress

            if ($LASTEXITCODE -ne 0) {
              throw "7-Zip installation failed with exit code $LASTEXITCODE."
            }

            $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          }

          if (-not (Test-Path -LiteralPath $sevenZip -PathType Leaf)) {
            throw '7z.exe was not found.'
          }

          Remove-Item `
            -LiteralPath $archivePath `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            -LiteralPath $extractPath `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host "Downloading Playnite $env:PLAYNITE_VERSION..."

          Invoke-WebRequest `
            -Uri $downloadUrl `
            -OutFile $archivePath `
            -UseBasicParsing

          New-Item `
            -Path $extractPath `
            -ItemType Directory `
            -Force |
            Out-Null

          & $sevenZip x $archivePath "-o$extractPath" -y

          if ($LASTEXITCODE -ne 0) {
            throw "Playnite archive extraction failed with exit code $LASTEXITCODE."
          }

          $toolbox = Get-ChildItem `
            -LiteralPath $extractPath `
            -Filter 'Toolbox.exe' `
            -File `
            -Recurse |
            Select-Object -First 1

          if (-not $toolbox) {
            throw 'Toolbox.exe was not found in the Playnite archive.'
          }

          $nlog = Join-Path `
            $toolbox.Directory.FullName `
            'NLog.dll'

          if (-not (Test-Path -LiteralPath $nlog -PathType Leaf)) {
            throw "NLog.dll was not found next to Toolbox.exe: $($toolbox.Directory.FullName)"
          }

          Write-Host "Playnite version: $env:PLAYNITE_VERSION"
          Write-Host "Playnite Toolbox: $($toolbox.FullName)"
          Write-Host "Toolbox NLog: $nlog"

          "PLAYNITE_TOOLBOX=$($toolbox.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8 

      - name: Build and package
        shell: powershell
        run: |
          .\scripts\pack.ps1 `
            -Configuration Release `
            -ToolboxPath $env:PLAYNITE_TOOLBOX

      - name: Validate release assets
        shell: powershell
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $package = "dist\Playnite-Boot-Screen-v$version.pext"
          $checksum = "$package.sha256"

          if (-not (Test-Path -LiteralPath $package)) {
            throw "Package not found: $package"
          }

          if (-not (Test-Path -LiteralPath $checksum)) {
            throw "Checksum not found: $checksum"
          }

          Write-Host "Package:  $package"
          Write-Host "Checksum: $checksum"

      - name: Create GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = '${{ github.ref_name }}'
          $package = "dist\Playnite-Boot-Screen-v$version.pext"
          $checksum = "$package.sha256"
          $title = "Playnite Boot Screen $version"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists. Published release assets are not overwritten."
          }

          gh release create $tag `
            $package `
            $checksum `
            --title $title `
            --notes-file RELEASE_NOTES.md `
            --verify-tag

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create release $tag."
          }

          Write-Host "Release $tag completed successfully."
